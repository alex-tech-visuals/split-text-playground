<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SplitText Playground</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --text: #000000;
      --muted: #707070;
      --line: #e5e5e5;
      --accent: #000000;
      --accent-text: #ffffff;
      --code-bg: #14141a;
      --code-text: #d7d7e0;
      --stage: #ffffff;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000;
        --panel: #000000;
        --text: #ffffff;
        --muted: #8a8a8a;
        --line: #262626;
        --accent: #ffffff;
        --accent-text: #000000;
        --code-bg: #000000;
        --code-text: #ffffff;
        --stage: #000000;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #000000;
      --panel: #000000;
      --text: #ffffff;
      --muted: #8a8a8a;
      --line: #262626;
      --accent: #ffffff;
      --accent-text: #000000;
      --code-bg: #000000;
      --code-text: #ffffff;
      --stage: #000000;
      color-scheme: dark;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 "Instrument Sans", system-ui, sans-serif;
      letter-spacing: -.03em
    }

    .app {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto
    }

    @media(max-width:860px) {
      .app {
        grid-template-columns: 1fr
      }
    }

    .panel {
      background: transparent;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      padding: 0 20px 0 0
    }

    h1 {
      font-size: 16px;
      margin: 0 0 2px
    }

    .sub {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 14px
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 12px 0 4px
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline
    }

    .row output {
      font-variant-numeric: tabular-nums;
      color: var(--text);
      font-size: 12px
    }

    textarea,
    select,
    input[type=text] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit
    }

    textarea {
      resize: vertical;
      min-height: 64px
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent)
    }

    .seg {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 3px
    }

    .seg button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 4px;
      border-radius: 6px;
      font: inherit;
      cursor: pointer
    }

    .seg button.on {
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 600
    }

    .chk {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer
    }

    .right {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0
    }

    .stage {
      position: relative;
      background: var(--stage);
      border: 1px solid var(--line);
      border-radius: 14px;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow: hidden
    }

    #target {
      margin: 0;
      text-align: center;
      max-width: 100%;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -.02em;
      white-space: pre-wrap;
      perspective: 600px
    }

    .bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .btn {
      background: var(--accent);
      color: var(--accent-text);
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer
    }

    .btn.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line)
    }

    .meta {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px
    }

    .opt {
      display: none;
      margin: 6px 0 0 26px
    }

    .opt.show {
      display: block
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px
    }

    .opt label {
      margin: 0 0 2px
    }

    .curve {
      display: block;
      width: 100%;
      max-width: 240px;
      touch-action: none;
      margin-bottom: 8px;
      overflow: visible
    }

    .curve .grid {
      fill: none;
      stroke: var(--line)
    }

    .curve .guide {
      stroke: var(--muted);
      stroke-dasharray: 3 3
    }

    .curve .path {
      fill: none;
      stroke: var(--text);
      stroke-width: 2
    }

    .curve .h {
      fill: var(--text);
      cursor: grab;
      touch-action: none
    }

    .curve .h:active {
      cursor: grabbing
    }

    input[type=checkbox] {
      appearance: none;
      -webkit-appearance: none;
      flex: none;
      width: 16px;
      height: 16px;
      margin: 0;
      border: 1px solid var(--text);
      border-radius: 4px;
      background: transparent;
      display: grid;
      place-content: center;
      cursor: pointer;
      transition: background .15s
    }

    input[type=checkbox]::after {
      content: "";
      width: 8px;
      height: 4px;
      border-left: 2px solid var(--accent-text);
      border-bottom: 2px solid var(--accent-text);
      transform: translateY(-1px) rotate(-45deg) scale(0);
      transition: transform .15s
    }

    input[type=checkbox]:checked {
      background: var(--accent)
    }

    input[type=checkbox]:checked::after {
      transform: translateY(-1px) rotate(-45deg) scale(1)
    }

    input[type=checkbox]:focus-visible,
    .seg button:focus-visible,
    .btn:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      padding-right: 32px;
      background-image: linear-gradient(45deg, transparent 50%, var(--text) 50%), linear-gradient(135deg, var(--text) 50%, transparent 50%);
      background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat
    }

    option {
      background: var(--bg);
      color: var(--text)
    }

    select:focus,
    textarea:focus,
    input[type=text]:focus {
      outline: none;
      border-color: var(--text)
    }

    #reset {
      width: 100%;
      margin: 24px 0 8px
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
      letter-spacing: inherit
    }

    .right {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + 16px);
      align-self: start
    }

    .stage {
      height: clamp(260px, 60vh, 600px);
      min-height: 0;
      border-radius: 6px
    }

    @media(max-width:860px) {
      .right {
        order: -1;
        top: env(safe-area-inset-top, 0px);
        background: var(--bg);
        padding: 8px 0;
        z-index: 5
      }

      .stage {
        height: 34vh
      }

      .panel {
        border-right: 0;
        padding: 0
      }
    }

    pre {
      margin: 0;
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: 12px;
      padding: 16px;
      overflow-x: auto;
      font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
    }

    .copy {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #ffffff1a;
      color: #fff;
      border: 1px solid #ffffff30;
      border-radius: 7px;
      padding: 5px 10px;
      font: 12px system-ui;
      cursor: pointer
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="panel">
      <h1>SplitText Playground</h1>
      <div class="sub">Tweak the controls, then copy the code.</div>

      <label>Text</label>
      <textarea id="text">Animate every letter,
word and line.</textarea>

      <label>Split by</label>
      <div class="seg" id="type">
        <button data-v="chars" class="on">Letters</button><button data-v="words">Words</button><button
          data-v="lines">Lines</button>
      </div>

      <label>Direction</label>
      <div class="seg" id="dir">
        <button data-v="in" class="on">In</button><button data-v="out">Out</button>
      </div>

      <label class="chk"><input type="checkbox" id="mask"> Mask (clip each item; slide travels full height)</label>

      <label>Effects (combine freely)</label>
      <label class="chk" style="margin-top:4px"><input type="checkbox" id="fade" checked> Opacity</label>
      <div class="opt show" data-for="fade"><label class="row">Start opacity <output id="o_fade"></output></label>
        <input type="range" id="fadeAmt" min="0" max="1" step="0.05" value="0">
      </div>

      <label class="chk"><input type="checkbox" id="slide" checked> Slide</label>
      <div class="opt show" data-for="slide">
        <select id="slideDir">
          <option value="bottom">from bottom</option>
          <option value="top">from top</option>
          <option value="left">from left</option>
          <option value="right">from right</option>
        </select>
      </div>

      <label class="chk"><input type="checkbox" id="blur"> Blur</label>
      <div class="opt" data-for="blur"><label class="row">Amount <output id="o_blur"></output></label>
        <input type="range" id="blurAmt" min="1" max="40" step="1" value="12">
      </div>

      <label class="chk"><input type="checkbox" id="scale"> Scale</label>
      <div class="opt" data-for="scale"><label class="row">Start scale <output id="o_scale"></output></label>
        <input type="range" id="scaleAmt" min="0" max="2" step="0.05" value="0">
      </div>

      <label class="chk"><input type="checkbox" id="rot"> Rotate</label>
      <div class="opt" data-for="rot"><label class="row">Angle <output id="o_rot"></output></label>
        <input type="range" id="rotAmt" min="-180" max="180" step="1" value="45">
      </div>

      <label class="chk"><input type="checkbox" id="flip"> Flip X (3D)</label>
      <div class="opt" data-for="flip"><label class="row">Angle <output id="o_flip"></output></label>
        <input type="range" id="flipAmt" min="-180" max="180" step="1" value="-90">
      </div>

      <label class="row">Duration per item <output id="o_dur"></output></label>
      <input type="range" id="dur" min="0.1" max="3" step="0.05" value="0.8">
      <label class="row">Stagger (between items) <output id="o_stag"></output></label>
      <input type="range" id="stag" min="0" max="0.5" step="0.005" value="0.04">
      <label class="row">Delay <output id="o_delay"></output></label>
      <input type="range" id="delay" min="0" max="3" step="0.05" value="0">
      <label class="row">Slide distance <output id="o_dist"></output></label>
      <input type="range" id="dist" min="0" max="200" step="1" value="50">

      <label>Ease</label>
      <select id="ease">
        <option>power1.out</option>
        <option>power2.out</option>
        <option selected>power3.out</option>
        <option>power4.out</option>
        <option>power2.inOut</option>
        <option>power3.inOut</option>
        <option>power3.in</option>
        <option>expo.out</option>
        <option>expo.inOut</option>
        <option>circ.out</option>
        <option>sine.out</option>
        <option>back.out(1.7)</option>
        <option>back.inOut(1.7)</option>
        <option>elastic.out(1,0.3)</option>
        <option>bounce.out</option>
        <option>none</option>
        <option value="custom">Custom…</option>
      </select>
      <div class="opt" id="customWrap" style="margin-left:0">
        <svg class="curve" id="curve" viewBox="0 0 200 220">
          <rect class="grid" x="20" y="60" width="160" height="100" />
          <line class="guide" id="g1" x1="20" y1="160" x2="20" y2="160" />
          <line class="guide" id="g2" x1="180" y1="60" x2="180" y2="60" />
          <path class="path" id="cpath" d="" />
          <circle class="h" id="h1" r="7" />
          <circle class="h" id="h2" r="7" />
        </svg>
        <input type="text" id="customEase" value="0.7,0,0.3,1" spellcheck="false">
        <div class="hint">Any GSAP ease (back.out(2), steps(6)…), cubic-bezier values (x1,y1,x2,y2) or an SVG path.
        </div>
      </div>

      <label>Stagger from</label>
      <select id="from">
        <option>start</option>
        <option>end</option>
        <option>center</option>
        <option>edges</option>
        <option>random</option>
      </select>

      <label>Font (Google Fonts name or link)</label>
      <input type="text" id="font" placeholder="e.g. Playfair Display" spellcheck="false">
      <div class="hint" id="fontMsg">Press Enter to load. Empty = system font.</div>

      <label class="row">Font size <output id="o_fs"></output></label>
      <input type="range" id="fs" min="16" max="160" step="1" value="64">
      <label class="row">Weight <output id="o_fw"></output></label>
      <input type="range" id="fw" min="100" max="900" step="100" value="700">
      <label class="row">Letter spacing <output id="o_ls"></output></label>
      <input type="range" id="ls" min="-0.1" max="0.5" step="0.005" value="-0.03">
      <label class="row">Word spacing <output id="o_ws"></output></label>
      <input type="range" id="ws" min="-0.2" max="1" step="0.01" value="0">
      <label class="row">Line height <output id="o_lh"></output></label>
      <input type="range" id="lh" min="0.7" max="2.5" step="0.05" value="1.1">

      <label class="chk"><input type="checkbox" id="loop"> Loop</label>
      <label class="chk"><input type="checkbox" id="theme"> Toggle light / dark</label>

      <button class="btn ghost" id="reset">Reset all</button>
    </div>

    <div class="right">
      <div class="stage">
        <div id="target"></div>
      </div>
      <div class="bar">
        <button class="btn" id="replay">▶ Replay</button>
        <button class="btn ghost" id="pause">Pause</button>
        <button class="btn ghost" id="copy">Copy code</button>
        <span class="meta" id="total"></span>
      </div>

    </div>
  </div>

  <script>
    (function () {
      gsap.registerPlugin(SplitText, CustomEase);
      var $ = function (id) { return document.getElementById(id); };
      var lastCode = "", curFont = "", curHref = "", stage = $("target"), split = null, tween = null, loopCall = null, debounce = null;
      var seg = { type: "chars", dir: "in" };

      document.querySelectorAll(".seg").forEach(function (g) {
        g.addEventListener("click", function (e) {
          var b = e.target.closest("button"); if (!b) return;
          g.querySelectorAll("button").forEach(function (x) { x.classList.remove("on"); });
          b.classList.add("on"); seg[g.id] = b.dataset.v; schedule();
        });
      });

      function read() {
        return {
          text: $("text").value || " ", type: seg.type, dir: seg.dir,
          fade: $("fade").checked, fadeAmt: +$("fadeAmt").value, blur: $("blur").checked, blurAmt: +$("blurAmt").value,
          slide: $("slide").checked, slideDir: $("slideDir").value,
          scale: $("scale").checked, scaleAmt: +$("scaleAmt").value,
          rot: $("rot").checked, rotAmt: +$("rotAmt").value,
          flip: $("flip").checked, flipAmt: +$("flipAmt").value,
          dur: +$("dur").value, stag: +$("stag").value, delay: +$("delay").value, dist: +$("dist").value,
          ease: $("ease").value === "custom" ? ($("customEase").value.trim() || "power3.out") : $("ease").value, from: $("from").value, fs: +$("fs").value, fw: +$("fw").value, ls: +$("ls").value, ws: +$("ws").value, lh: +$("lh").value, font: curFont, href: curHref, loop: $("loop").checked, mask: $("mask").checked
        };
      }

      function props(s) {
        var o = {};
        if (s.fade) o.opacity = s.fadeAmt;
        if (s.blur) o.filter = "blur(" + s.blurAmt + "px)";
        if (s.slide) {
          var map = { bottom: ["y", 1], top: ["y", -1], left: ["x", -1], right: ["x", 1] };
          var k = map[s.slideDir];
          if (s.mask) o[k[0] + "Percent"] = 110 * k[1]; else o[k[0]] = s.dist * k[1];
        }
        if (s.scale) o.scale = s.scaleAmt;
        if (s.rot) o.rotation = s.rotAmt;
        if (s.flip) { o.rotationX = s.flipAmt; o.transformOrigin = "50% 50% -20px"; }
        return o;
      }

      function fmt(o, ind) {
        return Object.keys(o).map(function (k) {
          var v = o[k];
          if (k === "stagger") return ind + "stagger: { each: " + v.each + (v.from !== "start" ? ", from: " + JSON.stringify(v.from) : "") + " },";
          return ind + k + ": " + JSON.stringify(v) + ",";
        }).join("\n");
      }

      function isPath(e) { return /^\s*-?[\d.]+(\s*,\s*-?[\d.]+){3}\s*$/.test(e) || /^\s*M/i.test(e); }

      function buildVars(s) {
        var v = props(s);
        v.duration = s.dur;
        v.ease = isPath(s.ease) ? "myEase" : s.ease;
        if (isPath(s.ease)) { try { CustomEase.create("myEase", s.ease); } catch (x) { v.ease = "none"; } }
        if (s.delay) v.delay = s.delay;
        v.stagger = { each: s.stag, from: s.from };
        return v;
      }

      function cssFor(s) {
        var link = s.font && s.href ? '\n\n/* In <head> */\n/* <link rel="stylesheet" href="' + s.href + '"> */' : '';
        return '\n\n/* CSS */\n.text {\n' + (s.font ? '  font-family: "' + s.font + '", sans-serif;\n' : '') +
          '  font-size: ' + s.fs + 'px;\n  font-weight: ' + s.fw + ';\n  letter-spacing: ' + s.ls + 'em;\n' +
          (s.ws ? '  word-spacing: ' + s.ws + 'em;\n' : '') + '  line-height: ' + s.lh + ';\n}' + link;
      }

      function codeFor(s) {
        var isMask = s.mask;
        var opts = '  type: "' + s.type + '"' + (isMask ? ',\n  mask: "' + s.type + '"' : "");
        var method = s.dir === "in" ? "from" : "to";
        var custom = isPath(s.ease);
        return 'gsap.registerPlugin(SplitText' + (custom ? ', CustomEase' : '') + ');\n\n' +
          (custom ? 'CustomEase.create("myEase", ' + JSON.stringify(s.ease) + ');\n\n' : '') +
          'const split = SplitText.create(".text", {\n' + opts + '\n});\n\n' +
          'gsap.' + method + '(split.' + s.type + ', {\n' + fmt(buildVars(s), "  ") + '\n});' + cssFor(s);
      }

      function play() {
        var s = read();
        if (tween) tween.kill();
        if (loopCall) loopCall.kill();
        if (split) split.revert();
        stage.textContent = s.text;
        stage.style.fontSize = s.fs + "px";
        stage.style.fontWeight = s.fw;
        stage.style.letterSpacing = s.ls + "em";
        stage.style.wordSpacing = s.ws + "em";
        stage.style.lineHeight = s.lh;
        stage.style.fontFamily = s.font ? '"' + s.font + '", sans-serif' : "";
        var isMask = s.mask;
        var opts = { type: s.type };
        if (isMask) opts.mask = s.type;
        split = SplitText.create(stage, opts);
        var targets = split[s.type];
        var vars = buildVars(s);
        vars.onComplete = function () { if (s.loop) loopCall = gsap.delayedCall(0.9, play); };
        tween = s.dir === "in" ? gsap.from(targets, vars) : gsap.to(targets, vars);

        var n = targets.length;
        var total = s.delay + s.dur + s.stag * Math.max(0, n - 1);
        $("total").textContent = n + " " + s.type + " · total " + total.toFixed(2) + "s";
        lastCode = codeFor(s);
        $("pause").textContent = "Pause";
      }

      function schedule() {
        clearTimeout(debounce);
        debounce = setTimeout(play, 120);
      }

      var outs = {
        dur: ["o_dur", "s"], stag: ["o_stag", "s"], delay: ["o_delay", "s"], dist: ["o_dist", "px"], fs: ["o_fs", "px"],
        fadeAmt: ["o_fade", ""], fw: ["o_fw", ""], ls: ["o_ls", "em"], ws: ["o_ws", "em"], lh: ["o_lh", ""], blurAmt: ["o_blur", "px"], scaleAmt: ["o_scale", ""], rotAmt: ["o_rot", "°"], flipAmt: ["o_flip", "°"]
      };
      Object.keys(outs).forEach(function (id) {
        var upd = function () { $(outs[id][0]).textContent = (+$(id).value).toString() + outs[id][1]; };
        $(id).addEventListener("input", function () { upd(); schedule(); });
        upd();
      });
      function sync() {
        $("customWrap").classList.toggle("show", $("ease").value === "custom");
        document.querySelectorAll("[data-for]").forEach(function (el) {
          el.classList.toggle("show", $(el.dataset.for).checked);
        });
      }
      ["text", "ease", "customEase", "from", "loop", "mask", "fade", "slide", "slideDir", "blur", "scale", "rot", "flip"].forEach(function (id) {
        $(id).addEventListener("input", function () { sync(); schedule(); });
        $(id).addEventListener("change", function () { sync(); schedule(); });
      });
      sync();

      function loadFont() {
        var raw = $("font").value.trim(), msg = $("fontMsg");
        var old = document.getElementById("gfont"); if (old) old.remove();
        curFont = ""; curHref = "";
        if (!raw) { msg.textContent = "Press Enter to load. Empty = system font."; return play(); }
        var name, href;
        if (/^https?:/i.test(raw)) {
          try {
            var u = new URL(raw);
            var fam = u.searchParams.get("family");
            if (u.hostname !== "fonts.googleapis.com" || !fam) { msg.textContent = "Use a fonts.googleapis.com link with a family parameter."; return; }
            name = fam.split(":")[0]; href = raw;
          } catch (e) { msg.textContent = "That link isn’t valid."; return; }
        } else {
          name = raw;
          href = "https://fonts.googleapis.com/css?family=" + encodeURIComponent(raw).replace(/%20/g, "+") + ":100,200,300,400,500,600,700,800,900&display=swap";
        }
        msg.textContent = "Loading…";
        var link = document.createElement("link");
        link.id = "gfont"; link.rel = "stylesheet"; link.href = href;
        link.onload = function () {
          document.fonts.load('700 64px "' + name + '"').then(function () {
            curFont = name; curHref = href; msg.textContent = "Loaded: " + name; play();
          });
        };
        link.onerror = function () { msg.textContent = "Couldn’t load that font. Check the name."; play(); };
        document.head.appendChild(link);
      }
      var bz = [0.7, 0, 0.3, 1], curveEl = $("curve"), bzRe = /^\s*-?[\d.]+(\s*,\s*-?[\d.]+){3}\s*$/;
      function drawCurve() {
        var p = [20 + bz[0] * 160, 160 - bz[1] * 100, 20 + bz[2] * 160, 160 - bz[3] * 100];
        $("h1").setAttribute("cx", p[0]); $("h1").setAttribute("cy", p[1]);
        $("h2").setAttribute("cx", p[2]); $("h2").setAttribute("cy", p[3]);
        $("g1").setAttribute("x2", p[0]); $("g1").setAttribute("y2", p[1]);
        $("g2").setAttribute("x2", p[2]); $("g2").setAttribute("y2", p[3]);
        $("cpath").setAttribute("d", "M20,160 C" + p[0] + "," + p[1] + " " + p[2] + "," + p[3] + " 180,60");
      }
      ["h1", "h2"].forEach(function (id, i) {
        var h = $(id), drag = false;
        h.addEventListener("pointerdown", function (e) { drag = true; h.setPointerCapture(e.pointerId); e.preventDefault(); });
        h.addEventListener("pointermove", function (e) {
          if (!drag) return;
          var pt = curveEl.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
          var c = pt.matrixTransform(curveEl.getScreenCTM().inverse());
          bz[i * 2] = Math.round(Math.min(1, Math.max(0, (c.x - 20) / 160)) * 100) / 100;
          bz[i * 2 + 1] = Math.round(Math.min(1.5, Math.max(-0.5, (160 - c.y) / 100)) * 100) / 100;
          $("customEase").value = bz.join(",");
          drawCurve(); schedule();
        });
        h.addEventListener("pointerup", function () { drag = false; });
        h.addEventListener("pointercancel", function () { drag = false; });
      });
      $("customEase").addEventListener("input", function () {
        if (bzRe.test(this.value)) { bz = this.value.split(",").map(Number); drawCurve(); }
      });
      drawCurve();
      $("font").addEventListener("change", loadFont);

      var defaults = {};
      document.querySelectorAll("input,select,textarea").forEach(function (el) {
        if (el.id && el.id !== "theme") defaults[el.id] = el.type === "checkbox" ? el.checked : el.value;
      });
      $("reset").addEventListener("click", function () {
        Object.keys(defaults).forEach(function (id) {
          var el = $(id);
          if (el.type === "checkbox") el.checked = defaults[id]; else el.value = defaults[id];
        });
        seg = { type: "chars", dir: "in" };
        document.querySelectorAll(".seg").forEach(function (g) {
          g.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === seg[g.id]); });
        });
        bz = [0.7, 0, 0.3, 1]; drawCurve();
        Object.keys(outs).forEach(function (id) { $(outs[id][0]).textContent = (+$(id).value).toString() + outs[id][1]; });
        var old = document.getElementById("gfont"); if (old) old.remove();
        curFont = ""; curHref = "";
        $("fontMsg").textContent = "Press Enter to load. Empty = system font.";
        sync(); play();
      });

      $("replay").addEventListener("click", play);
      $("pause").addEventListener("click", function () {
        if (!tween) return;
        if (tween.paused()) { tween.resume(); this.textContent = "Pause"; }
        else { tween.pause(); this.textContent = "Resume"; }
      });
      $("theme").addEventListener("change", function () {
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var cur = document.documentElement.getAttribute("data-theme") || (dark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
      });

      $("copy").addEventListener("click", function () {
        var btn = this, txt = lastCode;
        var done = function () { btn.textContent = "Copied ✓"; setTimeout(function () { btn.textContent = "Copy code"; }, 1500); };
        var fallback = function () {
          var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta);
          ta.select(); try { document.execCommand("copy"); done(); } catch (e) { } document.body.removeChild(ta);
        };
        try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
      });

      window.addEventListener("load", function () { document.fonts.load('700 64px "Instrument Sans"').then(play, play); });
    })();
  </script>
</body>

</html>
